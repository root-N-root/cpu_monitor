[package]
name = "cpu_monitor"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/root-N-root/cpu_monitor"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
procfs = "0.18.0"
reqwest = { version = "0.13.2", features = ["stream","multipart", "json"] }
serde = {version = "1.0.228", features = ['derive']}
serde_json = "1.0.149"
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7.3", features = ["codec"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
